<!DOCTYPE html>
<html>
<head>
<title>Hello World</title>
<style>
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes slideIn {
  from { transform: translateX(-100px); }
  to { transform: translateX(0); }
}

@keyframes bounce {
  0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
  40% { transform: translateY(-30px); }
  60% { transform: translateY(-15px); }
}

@keyframes rotate {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

@keyframes colorChange {
  0% { background-color: red; }
  50% { background-color: blue; }
  100% { background-color: green; }
}

@keyframes scaleUp {
  from { transform: scale(0.5); }
  to { transform: scale(1); }
}

@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.1); }
  100% { transform: scale(1); }
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  10%, 30%, 50%, 70%, 90% { transform: translateX(-10px); }
  20%, 40%, 60%, 80% { transform: translateX(10px); }
}

@keyframes flyIn {
  from { transform: translateY(100vh) rotate(180deg); opacity: 0; }
  to { transform: translateY(0) rotate(0deg); opacity: 1; }
}

@keyframes spin {
  from { transform: rotateY(0deg); }
  to { transform: rotateY(360deg); }
}

#hw1 {
  animation: fadeIn 5s infinite;
}

#hw2 {
  animation: slideIn 3s infinite;
}

#hw3 {
  animation: bounce 2s infinite;
}

#hw4 {
  animation: rotate 4s infinite;
}

#hw5 {
  animation: colorChange 5s infinite;
}

#hw6 {
  animation: scaleUp 3s infinite;
}

#hw7 {
  animation: pulse 2s infinite;
}

#hw8 {
  animation: shake 3s infinite;
}

#hw9 {
  animation: flyIn 5s infinite;
}

#hw10 {
  animation: spin 4s infinite;
}
</style>
</head>
<body>
<div id="hw1">Hello World</div>
<div id="hw2">Hello World</div>
<div id="hw3">Hello World</div>
<div id="hw4">Hello World</div>
<div id="hw5">Hello World</div>
<div id="hw6">Hello World</div>
<div id="hw7">Hello World</div>
<div id="hw8">Hello World</div>
<div id="hw9">Hello World</div>
<div id="hw10">Hello World</div>
</body>
</html>
