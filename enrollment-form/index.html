<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MPCI College Enrollment | Modern Form</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="form-container">
      <div class="form-header">
        <h2>MPCI College Enrollment</h2>
      </div>

      <form id="enrollmentForm">
        <!-- Personal Information -->
        <div class="form-group">
          <label for="fullname">Full Name</label>
          <i class="fas fa-user input-icon"></i>
          <input type="text" id="fullname" placeholder="Juan Dela Cruz" required />
        </div>

        <div class="row">
          <div class="form-group">
            <label for="dob">Date of Birth</label>
            <i class="fas fa-calendar-day input-icon"></i>
            <input type="date" id="dob" required />
          </div>
          <div class="form-group">
            <label for="sex">Gender</label>
            <i class="fas fa-venus-mars input-icon"></i>
            <select id="sex" required>
              <option value="">Select Gender</option>
              <option>Male</option>
              <option>Female</option>
              <option>Non-binary</option>
              <option>Prefer not to say</option>
            </select>
          </div>
        </div>

        <!-- Contact Information -->
        <div class="form-group">
          <label for="email">Email Address</label>
          <i class="fas fa-envelope input-icon"></i>
          <input type="email" id="email" placeholder="example@email.com" required />
        </div>

        <div class="form-group">
          <label for="mobile">Mobile Number</label>
          <i class="fas fa-phone input-icon"></i>
          <input type="tel" id="mobile" placeholder="09123456789" required />
        </div>

        <div class="form-group">
          <label for="address">Complete Address</label>
          <textarea id="address" placeholder="Street, Barangay, City, Province" required></textarea>
        </div>

        <!-- Academic Information -->
        <div class="form-group">
          <label for="course">Course to Enroll</label>
          <i class="fas fa-graduation-cap input-icon"></i>
          <select id="course" required>
            <option value="">Select a course</option>
            <option>Bachelor of Science in Information Technology</option>
            <option>Bachelor of Secondary Education</option>
            <option>BS in Business Administration</option>
            <option>Hospitality Management</option>
            <option>Other Degree Programs</option>
          </select>
        </div>

        <div class="row">
          <div class="form-group">
            <label for="school">High School Graduated</label>
            <i class="fas fa-school input-icon"></i>
            <input type="text" id="school" placeholder="Your high school name" required />
          </div>
          <div class="form-group">
            <label for="yeargrad">Year Graduated</label>
            <i class="fas fa-calendar-alt input-icon"></i>
            <input type="number" id="yeargrad" min="1990" max="2099" placeholder="YYYY" required />
          </div>
        </div>

        <!-- Document Uploads -->
        <div class="form-group">
          <label>Upload High School Transcript (PDF)</label>
          <div class="file-input">
            <div class="file-input-label">
              <span>Choose file</span>
              <i class="fas fa-file-pdf"></i>
            </div>
            <input type="file" id="transcript" accept=".pdf" required />
            <div class="file-name" id="transcript-name"></div>
          </div>
        </div>

        <div class="form-group">
          <label>Upload 2x2 ID Photo (JPEG/PNG)</label>
          <div class="file-input">
            <div class="file-input-label">
              <span>Choose file</span>
              <i class="fas fa-image"></i>
            </div>
            <input type="file" id="photo" accept="image/png, image/jpeg" required />
            <div class="file-name" id="photo-name"></div>
          </div>
        </div>

        <!-- Emergency Contact -->
        <div class="form-group">
          <label for="emergency">Emergency Contact Name & Number</label>
          <i class="fas fa-exclamation-triangle input-icon"></i>
          <input
            type="text"
            id="emergency"
            placeholder="Contact person and phone number"
            required
          />
        </div>

        <!-- Terms and Conditions -->
        <div class="checkbox-group">
          <input type="checkbox" id="terms" required />
          <label for="terms">
            I confirm all information is accurate and agree to the school's
            <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.
          </label>
        </div>

        <!-- Submit Button -->
        <button type="submit"><i class="fas fa-paper-plane"></i> Submit Enrollment</button>
      </form>
    </div>

    <script>
      // Show selected file names
      document.getElementById('transcript').addEventListener('change', function (e) {
        const fileName = e.target.files[0]?.name || 'No file selected'
        const nameElement = document.getElementById('transcript-name')
        nameElement.textContent = fileName
        nameElement.style.display = 'block'
      })

      document.getElementById('photo').addEventListener('change', function (e) {
        const fileName = e.target.files[0]?.name || 'No file selected'
        const nameElement = document.getElementById('photo-name')
        nameElement.textContent = fileName
        nameElement.style.display = 'block'
      })

      // Form submission
      document.getElementById('enrollmentForm').addEventListener('submit', function (e) {
        e.preventDefault()
        // Here you would typically send the form data to a server
        alert('Enrollment submitted successfully! We will contact you soon.')
        this.reset()
        document.querySelectorAll('.file-name').forEach(el => (el.style.display = 'none'))
      })
    </script>
  </body>
</html>
